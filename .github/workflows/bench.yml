name: benchmark

on:
  push:
    branches: [ main, starkware-development ]

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      with:
          components: rustfmt, clippy
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        enable-cache: true
    - name: Install python deps
      run: |
          make python-deps
          . cairo-vm-env/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV
    - name: Run benchmark
      run: make benchmark-action
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
      with:
        tool: 'cargo'
        output-file-path: output.txt
        benchmark-data-dir-path: "."
        # Access token to deploy GitHub Pages branch
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Push and deploy GitHub pages branch automatically
        auto-push: true
        alert-threshold: '130%'
        comment-on-alert: true
    - name: Clean benches
      run: make clean
